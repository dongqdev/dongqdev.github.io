<!-- Display GoatCounter pageviews -->
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const goatcounterId = '{{ site.analytics.goatcounter.id }}';

    const fetchCount = (path) => {
      // Decode first to prevent double-encoding (%25EC...), then encode properly
      let rawPath = decodeURIComponent(path);
      if (rawPath.length > 1 && rawPath.endsWith('/')) {
        rawPath = rawPath.slice(0, -1);
      }

      const url = `https://${goatcounterId}.goatcounter.com/counter/${encodeURIComponent(rawPath)}.json?_t=${Date.now()}`;
      return fetch(url, { cache: 'no-cache' })
        .then((response) => {
          if (!response.ok) throw new Error('Failed to fetch count');
          return response.json();
        })
        .then((data) => {
          if (!data || data.count === undefined || data.count === null) {
            return '1';
          }
          const rawCount = String(data.count).replace(/\D/g, '');
          return new Intl.NumberFormat().format(rawCount || 1);
        });
    };

    const pv = document.getElementById('pageviews');
    if (pv !== null) {
      fetchCount(location.pathname)
        .then((formatted) => { pv.innerText = formatted; })
        .catch(() => { pv.innerText = '1'; });
    }
  });
</script>
